[project]
name = "ml-npl-workshop2"
version = "0.1.0"
description = "Team 4 — Workshop #2: fine-tuned transformer for review sentiment. Machine Learning 2026-III, Universidad Distrital."
authors = [
    {name = "JulianCelisCreator",email = "celisjuliandavid@gmail.com"}
]
requires-python = ">=3.12,<3.15"
dependencies = [
    "numpy (>=2.5.4,<3.0.0)",
    "pandas (>=3.0.6,<4.0.0)",
    "pyarrow (>=26.0.0,<27.0.0)",
    "scikit-learn (>=1.9.1,<2.0.0)",
    "transformers (>=5.19.0,<6.0.0)",
    "tensorboard (>=2.21.0,<3.0.0)",
    "tqdm (>=4.70.1,<5.0.0)",
    "matplotlib (>=3.11.2,<4.0.0)",
    "gensim (>=4.4.0,<5.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[[tool.poetry.source]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
priority = "explicit"


# PyTorch built for AMD ROCm (RX 9060 XT, gfx1200). Optional so teammates on NVIDIA or
# CPU skip it (`poetry install --without rocm`) and install their own torch build.
[tool.poetry.group.rocm]
optional = true

[tool.poetry.group.rocm.dependencies]
torch = {version = "^2.14.1", source = "pytorch-rocm"}
triton-rocm = {version = "^3.8.0", source = "pytorch-rocm"}

[tool.poetry.group.dev.dependencies]
ipykernel = "^7.4.0"
pylint = "^4.1.3"

